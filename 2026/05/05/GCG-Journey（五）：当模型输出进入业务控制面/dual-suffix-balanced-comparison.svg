<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="482" viewBox="0 0 1180 482">
<rect width="1180" height="100%" fill="#ffffff"/>
<text x="44" y="48" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">双目标 GCG 的优化空间：joint-sum 只是 baseline</text>
<text x="44" y="78" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="500" fill="#4b5563" text-anchor="start">同一初始后缀、同一模型、同一两个业务目标；数值越低，目标 token 的局部可达性越强。</text>
<text x="44" y="125" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#374151" text-anchor="start">方法</text>
<text x="390" y="125" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">triage -&gt; MEDIUM</text>
<text x="675" y="125" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c" text-anchor="start">review -&gt; os.system(&#x27;ls&#x27;)</text>
<text x="955" y="125" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534" text-anchor="start">行为</text>
