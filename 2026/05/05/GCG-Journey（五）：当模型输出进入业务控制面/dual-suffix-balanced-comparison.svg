<rect x="44" y="410" width="1092" height="42" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="64" y="436" font-family="Inter, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534" text-anchor="start">观察：两个改进分支不是只改变曲线形状，而是在保持业务行为命中的同时，把两个目标分量继续压低。</text>
