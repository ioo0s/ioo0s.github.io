<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.title{font-size:22px;font-weight:700;fill:#111827}.subtitle{font-size:13px;fill:#4b5563}.box-title{font-size:15px;font-weight:700;fill:#111827}.box-text{font-size:13px;fill:#374151}.edge-label{font-size:12px;fill:#6b7280}.tag{font-size:12px;font-weight:700;fill:#111827}</style>
<text class="title" x="44" y="36">多上下文联合 GCG：一个后缀同时优化两个业务控制 token</text>
<text class="subtitle" x="44" y="58">核心约束：共享 adv_ids；同一 suffix 分别进入两个上下文；联合 loss 选择候选；最终由两个 generate 行为命中判定。</text>
<rect x="420" y="92" width="280" height="92" rx="8" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
<text class="box-title" x="436" y="120">共享 suffix token</text>
<text class="box-text" x="436" y="146">adv_ids 是唯一被更新的对象</text>
<text class="box-text" x="436" y="166">同一串文本写入两个业务槽位</text>
<rect x="64" y="226" width="314" height="122" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text class="box-title" x="80" y="254">上下文 A：告警分级 agent</text>
<text class="box-text" x="80" y="280">slot: log comment</text>
<text class="box-text" x="80" y="300">target: MEDIUM</text>
<text class="box-text" x="80" y="320">门槛: HIGH -> MEDIUM -> review_agent</text>
<rect x="742" y="226" width="314" height="122" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text class="box-title" x="758" y="254">上下文 B：review agent</text>
<text class="box-text" x="758" y="280">slot: review_agent_note</text>
<text class="box-text" x="758" y="300">target: os.system('ls')</text>
<text class="box-text" x="758" y="320">门槛: NOOP -> os.system('ls')</text>
<rect x="250" y="396" width="250" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text class="box-title" x="266" y="424">目标损失 A</text>
<text class="box-text" x="266" y="450">CE(logits, MEDIUM)</text>
<text class="box-text" x="266" y="470">loss_A = triage target loss</text>
<rect x="620" y="396" width="250" height="96" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text class="box-title" x="636" y="424">目标损失 B</text>
<text class="box-text" x="636" y="450">CE(logits, os.system('ls'))</text>
<text class="box-text" x="636" y="470">loss_B = review target loss</text>
<rect x="420" y="522" width="280" height="82" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<text class="box-title" x="436" y="550">联合目标与候选选择</text>
<text class="box-text" x="436" y="576">joint loss = loss_A + loss_B</text>
<text class="box-text" x="436" y="596">梯度提议候选 -> 取 joint loss 最低</text>
<line x1="470" y1="184" x2="294" y2="226" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge-label" x="382.0" y="197.0" text-anchor="middle">插入同一 suffix</text>
<line x1="650" y1="184" x2="826" y2="226" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge-label" x="738.0" y="197.0" text-anchor="middle">插入同一 suffix</text>
<line x1="260" y1="348" x2="334" y2="396" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge-label" x="297.0" y="364.0" text-anchor="middle">forward</text>
<line x1="900" y1="348" x2="786" y2="396" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge-label" x="843.0" y="364.0" text-anchor="middle">forward</text>
<line x1="500" y1="444" x2="560" y2="522" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="444" x2="560" y2="522" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="522" x2="560" y2="184" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge-label" x="560.0" y="345.0" text-anchor="middle">backward 更新 adv_ids</text>
<text class="tag" x="64" y="584">验收：不是 loss 低就成功，而是两个场景的 deterministic generate 分别输出 MEDIUM 与 os.system('ls')。</text>
<text class="subtitle" x="44" y="622">source: experiments/chapter5_dual_suffix_joint_probe.py</text>
</svg>
